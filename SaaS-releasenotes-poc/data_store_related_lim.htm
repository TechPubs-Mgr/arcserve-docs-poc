		<h1 class="heading1">Data Store Related</h1>
		<ul>
			<li class="listbullet" style="color: #000000;">We recommend avoiding the use of volumes larger than 64 TB for the index and destination folders in a Cloud data store. Microsoft's Volume Shadow Copy Service (VSS), which is used for creating snapshots, does not support volumes larger than 64 TB.</li>
		</ul>
	</body>
